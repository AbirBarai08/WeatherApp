<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="weather">
        <header>
            <input placeholder="Enter your city">
            <button>Search</button>
        </header>
        <main>
            <div class="curr-city">
                <div class="curr-city-weather-icon">
                    <img src="https://openweathermap.org/img/wn/10d@2x.png">
                </div>
                <div class="curr-city-weather">
                    <h2>Today</h2>
                    <h1>Kolkata</h1>
                    <p class="weather-desc temparature"></p>
                    <p class="weather-desc description"></p>
                    <p class="weather-desc humidity"></p>
                    <p class="weather-desc feels-like"></p>
                    <p class="weather-desc wind-speed"></p>
                    <p class="weather-desc pressure"></p>
                </div>
            </div>
            <div class="another-city">
                <div class="cities">
                    <p class="city">Delhi</p>
                    <div class="weather-icon">
                        <img>
                    </div>
                    <p class="another-city-temp"></p>
                </div>
                <div class="cities">
                    <p class="city">Pune</p>
                    <div class="weather-icon">
                        <img>
                    </div>
                    <p class="another-city-temp"></p>
                </div>
                <div class="cities">
                    <p class="city">Mumbai</p>
                    <div class="weather-icon">
                        <img>
                    </div>
                    <p class="another-city-temp"></p>
                </div>
                <div class="cities">
                    <p class="city">Bangalore</p>
                    <div class="weather-icon">
                        <img>
                    </div>
                    <p class="another-city-temp"></p>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
